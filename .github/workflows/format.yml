name: format

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nixfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Check Nix formatting
        run: nix fmt -- --ci

  security-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Check the security_alerts integration
        run: nix build -L .#checks.x86_64-linux.security-alerts
